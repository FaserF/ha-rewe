name: Update REWE Certificates

on:
  schedule:
    - cron: '0 6 1 * *' # On the 1st of every month at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-certs:
    name: Check and Update Certs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install curl_cffi cryptography

      - name: Download latest APK
        run: |
          python .github/scripts/fetch_rewe_apk.py rewe.apk

      - name: Extract and Compare Certificates
        id: cert_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p temp_certs
          if python .github/scripts/extract_rewe_certs.py rewe.apk temp_certs; then
            echo "Certs extracted successfully."
            
            # Calculate SHA256 of the new pem certificate
            NEW_HASH=$(sha256sum temp_certs/client.pem | cut -d' ' -f1)
            echo "New cert hash: $NEW_HASH"
            
            # Download latest release zip and check client.pem hash
            OLD_HASH=""
            mkdir -p latest_release
            if gh release download --repo "$REPO" --pattern "rewe.zip" --dir latest_release --clobber 2>/dev/null; then
              unzip -q latest_release/rewe.zip -d latest_release/extracted 2>/dev/null || true
              if [ -f latest_release/extracted/certs/client.pem ]; then
                OLD_HASH=$(sha256sum latest_release/extracted/certs/client.pem | cut -d' ' -f1)
              fi
            fi
            echo "Old cert hash: $OLD_HASH"
            
            if [ "$NEW_HASH" != "$OLD_HASH" ]; then
              echo "Certificate changed!"
              echo "changed=true" >> $GITHUB_OUTPUT
            else
              echo "No cert changes."
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Certs extraction failed!"
            exit 1
          fi

      - name: Trigger Release Workflow
        if: steps.cert_check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml --ref main -f release_type=stable

